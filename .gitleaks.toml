# .gitleaks.toml — IANUA
#
# Extends gitleaks' default ruleset; adds a single, narrowly scoped allowlist.
#
# Why: .secrets.baseline is the detect-secrets baseline. It stores SHA-1
# *digests* of strings that were human-reviewed and classified as false
# positives (the policy engine's "secret_handling" action-class labels). Those
# high-entropy hex digests trip gitleaks' generic-api-key rule, so the two
# secret scanners fight each other: the allowlist file of one is a "leak" to
# the other. The digests are one-way hashes of non-secrets — nothing
# recoverable, nothing sensitive.
#
# Scope is deliberately BOTH conditions together (condition = "AND"): the
# finding must be inside .secrets.baseline *and* on a `"hashed_secret"` digest
# line. A whole-file path allowlist would blind gitleaks to a real credential
# accidentally committed into the baseline (e.g. pasted into a mangled entry);
# this scoping keeps that detection live. Real secrets anywhere else —
# including in this config — are still caught, and baseline edits don't need
# fingerprint churn. Requires gitleaks >= 8.25 ([[allowlists]] + condition),
# which gitleaks-action v3 provides.

[extend]
useDefault = true

[[allowlists]]
description = "detect-secrets baseline: allow only the SHA-1 digest fields of reviewed false positives"
condition = "AND"
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''"hashed_secret":\s*"[a-f0-9]{40}"''']
