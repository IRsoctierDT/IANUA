# .pre-commit-config.yaml — IANUA
# Rename to ".pre-commit-config.yaml" at the repo root.
# Fast local quality gates that mirror the CI pipeline (AGENTS.md §7-§8).
# Setup:
#   pip install -e ".[dev]"
#   pre-commit install
#   pre-commit install --hook-type pre-push
#   detect-secrets scan > .secrets.baseline   # one-time, then review & commit
# Run on everything:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  # --- Repo hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key        # blocks committed private keys (AGENTS.md §5)
      - id: debug-statements

  # --- Lint + format (ruff) ----------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                      # lint; mirrors `ruff check .`
        args: ["--fix"]
      - id: ruff-format               # mirrors `ruff format --check .`

  # --- Static type checking (mypy) ---------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(agents|attack|intel|scripts|tests|dashboard|mcp|rag|compliance)/
        additional_dependencies: []   # add typed stub packages here as deps grow

  # --- Security static analysis (bandit) ---------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "agents", "attack", "intel", "scripts", "mcp"]
        additional_dependencies: ["bandit[toml]"]

  # --- Drift gates (stdlib-only, fast; mirror the read-only CI gates) -----
  - repo: local
    hooks:
      - id: rename-guard
        name: no legacy pre-IANUA identifiers
        entry: python scripts/rename_to_ianua.py --check
        language: system
        pass_filenames: false
      - id: status-page-sync
        name: status page in sync with status.data.json
        entry: python scripts/build_status_page.py --check
        language: system
        files: ^(docs/status\.(data\.json|html|json)|scripts/build_status_page\.py|pyproject\.toml)$
        pass_filenames: false
      - id: trust-page-sync
        name: trust page in sync with trust.data.json
        entry: python scripts/build_trust_page.py --check
        language: system
        files: ^(docs/trust\.(data\.json|html|json)|scripts/build_trust_page\.py)$
        pass_filenames: false
      - id: behavior-index-check
        name: Behavioral index in sync with detections/behaviors/
        entry: python scripts/build_behavior_index.py --check
        language: system
        files: ^(detections/behaviors/.*\.yml|detections/behaviors\.index\.json|scripts/build_behavior_index\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: intel-store-check
        name: Intel store digest + validity vs the pinned corpus
        entry: python scripts/check_intel_store.py --check
        language: system
        files: ^(intel/.*\.json|intel/store\.sha256|scripts/check_intel_store\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: mapping-rules-check
        name: Mapping ruleset digest + validity vs the pinned corpus
        entry: python scripts/check_mapping_rules.py --check
        language: system
        files: ^(agents/mapping/(rules/.*\.json|rules\.sha256)|scripts/check_mapping_rules\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: attack-corpus-check
        name: ATT&CK corpus shards match the signed pin
        entry: python scripts/update_attack.py --check
        language: system
        files: ^(attack/(data|pins)/.*\.json|attack/collection-index\.json|scripts/update_attack\.py)$
        pass_filenames: false
      - id: attack-navigator-sync
        name: ATT&CK Navigator layer in sync with the Sigma corpus
        entry: python scripts/build_attack_navigator.py --check
        language: system
        files: ^(detections/sigma/.*\.yml|docs/attack-navigator-layer\.json|scripts/build_attack_navigator\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false

  # --- Secret scanning (detect-secrets) ----------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.secrets\.baseline|data/)

  # --- Tests on push (heavier; not on every commit) ----------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest (with coverage gate)
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
