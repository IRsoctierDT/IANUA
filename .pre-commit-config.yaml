# .pre-commit-config.yaml — IANUA
# Rename to ".pre-commit-config.yaml" at the repo root.
# Fast local quality gates that mirror the CI pipeline (AGENTS.md §7-§8).
# Setup (keep that environment active when you commit: the ruff, mypy,
# bandit and detect-secrets hooks run its tools):
#   pip install -e ".[dev]"
#   pre-commit install
#   pre-commit install --hook-type pre-push
#   detect-secrets scan > .secrets.baseline   # one-time, then review & commit
# Run on everything:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  # --- Repo hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key        # blocks committed private keys (AGENTS.md §5)
      - id: debug-statements

  # --- The toolchain hooks run the dev environment's tools, not a second pin --
  # ruff, mypy, bandit and detect-secrets run through the interpreter that
  # `pip install -e ".[dev]"` set up, so they are the versions uv.lock pins
  # and CI runs. As hosted hook repos they carried their own pins and ran in
  # pre-commit's isolated environments, which never saw the project's
  # dependencies. Read on 2026-10-23: ruff v0.6.9 against 0.17.1, mypy
  # v1.11.2 against 2.4.0 and bandit 1.7.10 against 1.9.4
  # (docs/PATH_RECONCILIATION_AUDIT.md G2). `python -m` resolves each one
  # through the same interpreter as the drift gates below.
  # tests/unit/test_gate_scope_parity.py refuses a hosted repo for any of them.
  #
  # Every hook here that receives filenames ends its args with "--". pre-commit
  # appends the filenames after the args, so without it a tracked file named
  # like an option is read as one. Measured on 2026-10-23 in a throwaway repo:
  # a file named `--help` staged beside a private key made the detect-secrets
  # hook print its usage and pass at exit 0, the AGENTS.md §7.1 hazard on the
  # pre-commit path. tests/security/test_secret_gate.py runs that invocation.

  # --- Lint + format (ruff) ----------------------------------------------
  - repo: local
    hooks:
      - id: ruff                      # lint; mirrors `ruff check .`
        name: ruff check (locked toolchain)
        entry: python -m ruff check --force-exclude
        args: ["--fix", "--"]
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format               # mirrors `ruff format --check .`
        name: ruff format (locked toolchain)
        entry: python -m ruff format --force-exclude
        args: ["--"]
        language: system
        types_or: [python, pyi]
        require_serial: true

  # --- Static type checking (mypy) ---------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked toolchain)
        entry: python -m mypy
        args: ["--"]
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: ^(agents|attack|intel|ingest|store|correlation|pipeline|collect|scripts|tests|dashboard|mcp|rag|compliance|sli)/

  # --- Security static analysis (bandit) ---------------------------------
  - repo: local
    hooks:
      - id: bandit
        name: bandit (locked toolchain)
        entry: python -m bandit
        args: ["-c", "pyproject.toml", "-r", "agents", "attack", "intel", "ingest", "store", "correlation", "pipeline", "collect", "scripts", "mcp", "sli"]
        language: system
        types: [python]
        pass_filenames: false       # the whole §7 scope, as CI scans it

  # --- Drift gates (stdlib-only, fast; mirror the read-only CI gates) -----
  - repo: local
    hooks:
      - id: rename-guard
        name: no legacy pre-IANUA identifiers
        entry: python scripts/rename_to_ianua.py --check
        language: system
        pass_filenames: false
      - id: status-page-sync
        name: status page in sync with status.data.json
        entry: python scripts/build_status_page.py --check
        language: system
        files: ^(docs/status\.(data\.json|html|json)|scripts/build_status_page\.py|pyproject\.toml)$
        pass_filenames: false
      - id: trust-page-sync
        name: trust page in sync with trust.data.json
        entry: python scripts/build_trust_page.py --check
        language: system
        files: ^(docs/trust\.(data\.json|html|json)|scripts/build_trust_page\.py)$
        pass_filenames: false
      - id: behavior-index-check
        name: Behavioral index in sync with detections/behaviors/
        entry: python scripts/build_behavior_index.py --check
        language: system
        files: ^(detections/behaviors/.*\.yml|detections/behaviors\.index\.json|scripts/build_behavior_index\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: intel-store-check
        name: Intel store digest + validity vs the pinned corpus
        entry: python scripts/check_intel_store.py --check
        language: system
        files: ^(intel/.*\.json|intel/store\.sha256|scripts/check_intel_store\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: mapping-rules-check
        name: Mapping ruleset digest + validity vs the pinned corpus
        entry: python scripts/check_mapping_rules.py --check
        language: system
        files: ^(agents/mapping/(rules/.*\.json|rules\.sha256)|scripts/check_mapping_rules\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false
      - id: attack-corpus-check
        name: ATT&CK corpus shards match the signed pin
        entry: python scripts/update_attack.py --check
        language: system
        files: ^(attack/(data|pins)/.*\.json|attack/collection-index\.json|scripts/update_attack\.py)$
        pass_filenames: false
      - id: attack-navigator-sync
        name: ATT&CK Navigator layer in sync with the Sigma corpus
        entry: python scripts/build_attack_navigator.py --check
        language: system
        files: ^(detections/sigma/.*\.yml|docs/attack-navigator-layer\.json|scripts/build_attack_navigator\.py|attack/(data|pins)/.*\.json)$
        pass_filenames: false

  # --- Secret scanning (detect-secrets) ----------------------------------
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets (locked toolchain)
        entry: python -m detect_secrets.pre_commit_hook   # the module behind `detect-secrets-hook`
        args: ["--baseline", ".secrets.baseline", "--"]
        language: system
        exclude: ^(\.secrets\.baseline|data/)

  # --- Tests on push (heavier; not on every commit) ----------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest (with coverage gate)
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
