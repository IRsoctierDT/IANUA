# release.yml — IANUA
# Place at:  .github/workflows/release.yml
#
# Attaches verifiable supply-chain artifacts to every GitHub Release:
# built distributions (wheel + sdist), the CycloneDX SBOM, and the Sigstore
# attestation bundles (SBOM predicate + SLSA build provenance), so consumers
# get everything needed for offline verification from the release page itself.
# Closes docs/HARDENING_ROADMAP.md §4's remaining gap: "publish attestations
# alongside releases."
#
# Human approval remains explicit: publish a release, manually dispatch this
# workflow from the default branch, or approve the `release` environment in
# release-on-merge.yml (which tags the CI-verified commit, then dispatches
# this workflow). A dispatch builds first, then creates the release with
# assets; existing tags are resolved without moving them.
# No push, schedule, or pull-request publication trigger is permitted.
#
# Release immutability is enabled on the repository (2026-10-23), so a
# release published after that locks its tag and assets the moment it is
# published. `gh release create` attaches every asset to a draft before it
# publishes, so the dispatch path is unaffected. A release published from the
# web page locks before this workflow can attach anything: that route now ends
# in a failed job naming the missing assets, and is not a way to release.
#
# Fail-closed (HARDENING_ROADMAP §4 acceptance criteria): a build, signing,
# or upload failure fails the job — no continue-on-error anywhere.

name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Canonical release tag (e.g. v2.1.0); existing tags are never moved'
        required: true
        type: string

# Least privilege by default; the job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-assets:
    name: Attach dists + SBOM + attestations to the release
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload assets to this repo's releases
      id-token: write       # OIDC for Sigstore keyless signing
      attestations: write   # write the signed attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Resolve immutable release source
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            git checkout --detach "refs/tags/$TAG"
          elif [ "$EVENT" != workflow_dispatch ]; then
            echo "Release event has no matching tag"; exit 1
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Verify canonical release tag and version chain
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/check_version_sync.py --tag "$TAG"
      - name: Verify the committed SBOM is usable before shipping it
        # The tag is expected to point at a CI-green main commit (drift gates
        # already proved SBOM <-> uv.lock sync there). This is a last-line
        # structural check so a malformed or missing SBOM can never be
        # attached to a release: fail closed, do not regenerate here — the
        # committed, drift-gated file is the canonical artifact.
        run: |
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | length > 0)' \
            security/sbom/sbom.cdx.json >/dev/null \
            || { echo "::error::security/sbom/sbom.cdx.json missing or malformed"; exit 1; }
      - name: Install the tag's dev toolchain, hash-pinned
        # The tag's own lock, so validation runs the tools the tag was tested
        # with, each file checked against its SHA-256. Every tag that passes
        # the version-chain check above (v2.1.0 and later) has one. The
        # editable install takes no dependencies; the project declares none.
        run: |
          pip install --require-hashes -r security/sbom/requirements-dev.lock
          pip install --no-deps -e .
      - name: Validate release source
        # The type-check scope is DERIVED from the checked-out tree rather than
        # hard-coded. This job runs against a detached tag, and a tag predating
        # any package in the list would hand mypy a directory that does not
        # exist on that commit — making release repair (re-attaching assets,
        # re-attesting) impossible for every older tag. Skipped paths are
        # printed, so a package missing by accident is visible rather than
        # silently dropped; the tagged commit was already gated by ci.yml with
        # the full scope when it merged, and tests/unit/test_gate_scope_parity.py
        # keeps that scope honest.
        run: |
          ruff check .
          ruff format --check .
          scope=""
          for dir in agents attack intel ingest store correlation pipeline collect \
                     scripts tests dashboard mcp rag compliance sli; do
            if [ -d "$dir" ]; then
              scope="$scope $dir"
            else
              echo "::notice::mypy scope: $dir absent at this tag, skipping"
            fi
          done
          echo "mypy scope:$scope"
          mypy --python-executable "$(command -v python)" $scope
          pytest
      - name: Install the package builder, hash-pinned, in its own environment
        # From this workflow's own commit, not the checked-out tag. Tags cut
        # before `build` joined [dev] (v2.3.1 and earlier) have no pin for it,
        # and a dispatch for an existing tag runs against one. A separate venv
        # leaves the tag's toolchain above exactly as it was.
        run: |
          git show "$GITHUB_SHA:security/sbom/requirements-dev.lock" > "$RUNNER_TEMP/builder.lock"
          python -m venv "$RUNNER_TEMP/builder"
          "$RUNNER_TEMP/builder/bin/pip" install --require-hashes -r "$RUNNER_TEMP/builder.lock"
      - name: Build distributions from the tagged commit
        run: '"$RUNNER_TEMP/builder/bin/python" -m build'
      - name: Attest SBOM for the release artifacts (Sigstore)
        # Same skip guard as ci.yml: the Attestations API rejects user-owned
        # private repos. Skip (not continue-on-error) so real signing errors
        # still fail the release everywhere attestation is supported.
        id: attest-sbom
        if: >-
          !(github.event.repository.private == true &&
            github.event.repository.owner.type == 'User')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: "security/sbom/sbom.cdx.json"
      - name: Attest build provenance for the release artifacts (SLSA)
        id: attest-provenance
        if: >-
          !(github.event.repository.private == true &&
            github.event.repository.owner.type == 'User')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - name: Stage attestation bundles under stable asset names
        # bundle-path files carry generated names; copy to stable, documented
        # names so release consumers and verification docs can rely on them.
        # Paths flow through env, never inline shell interpolation (injection
        # hygiene, even for action-generated values).
        if: steps.attest-sbom.outputs.bundle-path != ''
        env:
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: |
          cp "$SBOM_BUNDLE" sbom-attestation.intoto.jsonl
          cp "$PROVENANCE_BUNDLE" provenance-attestation.intoto.jsonl
      - name: Stage complete release assets and checksums
        run: |
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz security/sbom/sbom.cdx.json release-assets/
          for bundle in sbom-attestation.intoto.jsonl provenance-attestation.intoto.jsonl; do
            [ ! -f "$bundle" ] || cp "$bundle" release-assets/
          done
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Retain assets even if GitHub release publication fails
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-${{ github.event.release.tag_name || inputs.tag }}
          path: release-assets/
          if-no-files-found: error
      - name: Compose release notes from the curated changelog section
        # --generate-notes lists the merged pull requests, which is a commit
        # record rather than release notes: the `## vX.Y.Z` section in
        # docs/Changelog.md — written when the release was prepared and
        # reviewed on the release PR — was never published. This composes the
        # body from that section and appends a compare link, so the full
        # commit record is still one click away. Fail-closed: a missing or
        # empty section fails the job rather than publishing blank notes.
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_REPO: ${{ github.repository }}
        # GUARDED, and the guard is load-bearing. release-on-merge.yml
        # dispatches this workflow with `--ref main`, so the RECIPE comes from
        # main while "Resolve immutable release source" detaches the CHECKOUT
        # to the tag. A tag cut before this script existed therefore has no
        # scripts/release_notes.py, and an unguarded `python` would fail the
        # publish — breaking the documented post-dispatch-failure recovery
        # path for exactly those tags. v2.2.0 is one: the script landed in
        # #193, after the tag. Degrade to --generate-notes rather than refuse
        # to republish an older release.
        run: |
          if [ -f scripts/release_notes.py ]; then
            python scripts/release_notes.py --tag "$TAG" --repo "$GH_REPO" --output /tmp/notes.md
          else
            echo "::warning::scripts/release_notes.py is absent at $TAG (tag predates it); falling back to --generate-notes"
          fi
      - name: Create release with assets or repair existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --json isDraft > /tmp/release-state.json; then
            jq -e '.isDraft == false' /tmp/release-state.json >/dev/null
            # GitHub fixes a release's immutability when it is published, so a
            # release from before the repository setting was enabled (v2.3.0
            # and earlier) stays repairable and a later one refuses every
            # upload. Read it per release, and refuse to guess when it cannot
            # be read.
            immutable="$(gh release view "$TAG" --json isImmutable --jq '.isImmutable')"
            if [ "$immutable" = false ]; then
              gh release upload "$TAG" release-assets/* --clobber
            elif [ "$immutable" = true ]; then
              # Nothing can be attached or replaced, and this run's set never
              # matches the published one byte for byte (the attestation
              # bundles are signed afresh on every run), so the published
              # assets stand and are only checked for presence below. A
              # missing one cannot be repaired: publish the next patch version
              # through the release flow instead.
              echo "::notice::$TAG is an immutable release; its published assets are kept as they are"
            else
              echo "::error::cannot tell whether $TAG is an immutable release; refusing to upload to it"
              exit 1
            fi
          else
            # GITHUB_TOKEN-created releases do not trigger another workflow;
            # all assets are already built, tested, and signed in this run.
            # Repairing an existing release deliberately leaves its notes
            # alone; only a first publication writes them.
            if [ -f /tmp/notes.md ]; then
              gh release create "$TAG" release-assets/* \
                --target "$(git rev-parse HEAD)" --title "IANUA $TAG" \
                --notes-file /tmp/notes.md
            else
              gh release create "$TAG" release-assets/* \
                --target "$(git rev-parse HEAD)" --title "IANUA $TAG" --generate-notes
            fi
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            grep -Fxq "$name" /tmp/release-assets.txt \
              || { echo "::error::$TAG has no release asset named $name"; exit 1; }
          done
