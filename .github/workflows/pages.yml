# pages.yml — GitHub Pages deployment (AGENTS.md §8)
# Publishes docs/ to GitHub Pages after CI passes on main (workflow_run trigger)
# or on an explicit manual dispatch. Never fires on a raw push, per AGENTS.md
# §5.1/§8 (CI is the security/quality gate before anything reaches the public
# site).
#
# Publish gates (defense in depth, AGENTS.md §5.1/§7-§8):
#   1. CI success — a green CI run for a PUSH to main in THIS repository (lint,
#      tests, SAST, SCA, SBOM, secret scan) is required before this workflow
#      runs at all. The push/repository half is load-bearing: see the job gate.
#   2. Human approval — the github-pages environment keeps a *required-reviewer*
#      protection rule, so the deploy waits for an operator to approve it (§5.1:
#      external/deploy actions stay human-in-the-loop). This is intentional.
#
# Why ONE job (not the canonical build/deploy split):
#   The two-job pattern uploads the site artifact in `build` and consumes it in
#   `deploy`. That is safe only when approval is instant. With the human gate in
#   place (gate #2), the deploy can wait hours or days — longer than the Pages
#   artifact's ~1-day retention — so by the time it is approved the artifact has
#   expired and deploy fails with "No artifacts named github-pages were found".
#   Combining build + deploy into a single environment-gated job fixes that: the
#   approval holds the whole job, and once approved the artifact is built,
#   uploaded, and deployed in one shot, so it is always fresh. The approval gate
#   itself is unchanged.
#
# Security posture (AGENTS.md §3):
#   - Minimal permissions: contents:read + pages:write + id-token:write only,
#     and the two writes are granted on the one job, not the workflow.
#   - No secrets needed — GITHUB_TOKEN is auto-provisioned.
#   - The pre-deploy steps (checkout, drift check) run trusted, local repo files
#     only — no untrusted or external input — so sharing the job's environment
#     scope with them carries no meaningful additional risk.
#
# Prerequisite (one-time): repo Settings → Pages → Source → "GitHub Actions",
# and set the operator(s) as required reviewers on the github-pages environment.

name: Deploy GitHub Pages

on:
  # Fire only after the full CI workflow completes on main, so the
  # quality/security gates pass before any content reaches the public site.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # On-demand deploy (content-only changes, or operator-initiated publish).
  workflow_dispatch:

# Concurrency lives on the `deploy` job below, NOT here. A workflow-level group
# is claimed when the RUN is created, before any job `if:` is evaluated, so a
# run whose only job is then skipped still cancelled the deploy waiting for
# approval. Measured from this repository's Actions history by the review of
# the job gate: four waiting deploys cancelled by runs whose only job was
# `skipped`, the cancellation landing one second before the canceller's job was
# evaluated. The job gate alone closed the enqueue half of that hole and left
# the cancel half open. Pinned by tests/security/test_workflow_triggers.py.

# Least privilege by default (AGENTS.md §3); the job opts into its two writes.
permissions:
  contents: read

jobs:
  # Single environment-gated job: approval holds the whole job, then build +
  # upload + deploy all run fresh in one shot (see header for why not split).
  deploy:
    name: Build & deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write     # actions/deploy-pages creates the Pages deployment
      id-token: write  # OIDC token deploy-pages presents to the Pages service
    # Latest-content-wins, claimed only once the gate below has passed: a
    # skipped job never enters its group. Unlike GitHub's default
    # (cancel-in-progress: false) we DO cancel a superseded deploy: publishing
    # docs is idempotent, the newest commit should win, and a deploy stuck in
    # `waiting` for approval can then never permanently block the queue.
    concurrency:
      group: pages
      cancel-in-progress: true
    # workflow_run: only a green CI run for a PUSH to main in THIS repository.
    # `branches: [main]` above filters on the triggering run's *head* branch,
    # and a pull_request CI run from a fork whose head branch is named `main`
    # (the default name for a fork) carries that name too. Checking only the
    # conclusion therefore let an unprivileged PR enqueue a deploy under the
    # approval gate; this gate closes that. It does NOT stop such a run from
    # cancelling a deploy already waiting — a workflow-level concurrency group
    # is claimed before any job gate runs — which is why the group sits on this
    # job (above). The content deployed was never at risk (the checkout below
    # is the default branch), the queue was. Same four conditions as
    # release-on-merge.yml's `detect` job, pinned by
    # tests/security/test_workflow_triggers.py.
    # workflow_dispatch: only from main — a manual run must never publish docs/
    # from an untested branch, which would bypass the CI-success gate.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Verify the status page is in sync with its source data
        # Fail closed if docs/status.html or docs/status.json drifted from
        # docs/status.data.json (mirrors the SBOM/lock drift gates in ci.yml).
        # Stdlib-only, no dependency install needed.
        run: python scripts/build_status_page.py --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
