# OpenSSF Scorecard analysis of this repository's own supply-chain posture,
# reported into the Code scanning dashboard.
#
# Why this exists, and why it is a workflow: Scorecard is a GitHub Action. It
# arrived in #232 as three lines appended to `.pre-commit-config.yaml` — a
# `- name:`/`uses:` pair, which is Actions syntax and not a pre-commit
# repository mapping (those need `repo`, `rev`, `hooks`). The indentation also
# made that file unparseable, so `pre-commit run --all-files` died with
# `InvalidConfigError` before any hook ran and the required local gate was a
# no-op for every developer until it was reverted. Scorecard's own installation
# instructions put it here, under `.github/workflows/`, and this is that move.
#
# What it measures is the posture this repository already cares about: whether
# actions are pinned by SHA, whether workflow tokens are least-privilege,
# whether dangerous workflow patterns are present, whether dependency updates
# are automated, whether a SAST tool runs. Those are AGENTS.md §3 and §8
# claims, graded by a third party instead of by us.
#
# `publish_results: false`, deliberately. Setting it true would POST results to
# the OpenSSF REST API and enable a public badge — outbound egress of repository
# metadata, which AGENTS.md §5.1 classes as an external-network action requiring
# human approval with the URL shown in full. The endpoint is
# https://api.scorecard.dev, read from the pinned action's own
# `internal_publish_base_url` default (`action.yaml` at the SHA below) rather
# than from memory: an earlier version of this comment said
# `api.securityscorecards.dev`, which is the wrong host to show for a §5.1
# approval. The owner was shown it and chose `false`.
#
# What that choice does and does NOT buy, because the first version of this
# comment overstated it. IANUA is a PUBLIC repository, and the pinned action's
# README says the Scorecard team runs a weekly scan of public repositories whose
# results are publicly available, with `publish_results: true` *replacing* those
# results with this workflow's. So `false` means **this run is not submitted to
# OpenSSF** — it does not keep the repository out of the public dataset, and the
# earlier claims of "keep results private" and "no entry in the public OpenSSF
# dataset" were both wrong. What is given up is the badge and having the public
# entry come from our own run rather than theirs.
#
# The SARIF artifact below is likewise not private: the same README states those
# results are "available to anybody for five days after the run". That upload is
# the owner's choice (Code scanning *and* the Actions tab) and stays; it is
# recorded here so the next reader does not mistake it for a private channel.
#
# That choice is also why `id-token: write` is absent below. It exists solely to
# sign published results, so with publishing off it would be a permission
# granted for nothing — and `tests/unit/test_scorecard_workflow.py` asserts it
# stays absent, so turning publishing on is a deliberate edit that fails a test
# until the decision above is revisited.
#
# Pins are full commit SHAs per this repository's convention, and all four are
# taken from OpenSSF's own `scorecard-analysis.yml` rather than from memory;
# `actions/checkout` and `actions/upload-artifact` resolve to the exact SHAs
# this repo already pins elsewhere. Dependabot's `actions-all` group keeps them
# current.
#
# v2.5.0 is both the version #232 asked for and the newest tag upstream,
# measured with `git ls-remote --tags` rather than assumed: the version-sorted
# list ends v2.4.3, v2.4.4, v2.5.0, with no v2.5.x or v3 above it.
#
# One trap if anyone re-resolves that pin by hand: `ls-remote` returns two rows
# for the tag, and only one of them belongs in `uses:`. `refs/tags/v2.5.0` is
# `46dc3187a971a9febf3aeb7f94ccde489f7bb46a`, the **annotated tag object**;
# `refs/tags/v2.5.0^{}` is `fa7117db83c52d787ae5a89f350999701505d78e`, the
# peeled **commit**, which is what is pinned below. Two independent resolutions
# agree on it — OpenSSF's own committed workflow and the peeled ref.
name: Scorecard supply-chain analysis

on:
  # Keeps the Branch-Protection check fresh. Default branch only.
  branch_protection_rule:
  schedule:
    - cron: "47 5 * * 6" # weekly Saturday 05:47 UTC (off the hour to avoid load spikes)
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref: a posture scan only needs to describe
# the current tree, and `push` fires on every merge to main.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default (AGENTS.md §3). The job opts into exactly one more.
permissions:
  contents: read

jobs:
  # `ossf/scorecard-action` is a DOCKER action: its `action.yaml` at the SHA
  # pinned below reads `image: "docker://ghcr.io/ossf/scorecard-action:v2.5.0"`.
  # So the 40-hex `uses:` pin fixes `action.yaml` and NOT the container that
  # runs — whoever can push that tag in ghcr.io/ossf chooses the code. Nothing
  # else here can see that happen: the `uses:` SHA does not change, so
  # Dependabot never opens a pull request, and
  # `tests/security/test_workflow_permissions.py` sees a correctly pinned
  # action, because it is one.
  #
  # This job re-resolves the tag against the registry and compares it with the
  # digest committed in `security/third-party-actions.json`. It DETECTS a moved
  # tag; it does not prevent one (only an image referenced by digest does that,
  # which is upstream's to do), and the record says so rather than claiming the
  # gap is closed.
  #
  # It is a separate job, not a step, and that is load-bearing. Measured from
  # the runner's own source (`actions/runner`,
  # `ActionManager.PrepareRepositoryActionAsync`): a Docker action's image is
  # collected into `state.ImagesToPull` and pulled by `PullActionContainerAsync`
  # during job PREPARATION, before any step executes. A check running as an
  # earlier step in `analysis` would therefore report on an image that had
  # already been pulled. As its own job with `needs:` below, it runs to
  # completion first and `analysis` never starts if the tag moved.
  #
  # Egress, named in full for the §5.1 record — the two exact URLs, anonymous
  # and read-only, with no credential of this repository's sent:
  #   https://ghcr.io/token?scope=repository:ossf/scorecard-action:pull&service=ghcr.io
  #   https://ghcr.io/v2/ossf/scorecard-action/manifests/v2.5.0
  # The repository and tag come from the record, but the registry does not: the
  # script refuses any host outside its own committed allow-list rather than
  # following the record wherever it points.
  image-pin:
    name: Pinned image tag still resolves to the committed digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # stdlib only, so the runner's preinstalled python3 is enough and this
      # adds no action and no dependency. `dependencies = []` stands.
      - name: Re-resolve the tag and compare
        run: python3 scripts/check_action_image_digest.py

  analysis:
    name: Scorecard analysis (SARIF to code scanning)
    runs-on: ubuntu-latest
    # Gate, not garnish: if the tag moved, the image is never pulled for
    # analysis. Exit 1 is a moved tag and exit 2 is "could not determine" —
    # both stop this job, because a check that cannot answer must not pass.
    needs: image-pin
    # READ-ONLY, and that split is the point of the job boundary below.
    #
    # A workflow token is JOB-scoped, not step-scoped. While the SARIF upload
    # lived in this job, the job held `security-events: write` — and so the
    # scorecard container received a token carrying that write, through two
    # inputs that default to it. Read at the pinned SHA of `action.yaml`:
    # `repo_token` and `internal_default_token` both default to
    # `${{ github.token }}`, so GitHub passes the job's token into the
    # container as INPUT_REPO_TOKEN and INPUT_DEFAULT_TOKEN. For a DOCKER
    # action the image is the code and the image is not fixed by our 40-hex
    # pin (see the image-pin job above), so that token reached code this
    # repository cannot read, for an upload the container never performs.
    #
    # Least privilege (AGENTS.md §3) is therefore not expressible inside one
    # job: the only way to keep the write away from the scorecard container is
    # to put the write in a different job. That is the `code-scanning` job
    # below, which never runs a third-party action.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scorecard reads the tree; it never needs the token on disk, and a
          # persisted credential is one of the things it grades against.
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # See the header: false keeps every finding inside this repository.
          publish_results: false
      # The artifact is now the HANDOFF, not a convenience copy: it is how the
      # SARIF reaches the job that holds the write. Its retention is therefore
      # a functional bound and not housekeeping.
      - name: Upload the SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

  # The one write this workflow holds, in a job that runs NO third-party
  # action — only `actions/*` and `github/codeql-action/*`, both of which are
  # GitHub's own platform and need no vendor review record (AGENTS.md §5.1).
  #
  # What this buys, stated precisely so it is not over-read: the token with
  # `security-events: write` is now only ever handed to first-party code. It
  # does NOT make the SARIF trustworthy — the file is produced by the
  # unreviewed scorecard image and uploaded verbatim, exactly as before. The
  # change is who holds the write, not what is written.
  #
  # Failure semantics: if this job fails the SARIF is still retrievable from
  # the run artifact above, which is strictly better than the previous
  # arrangement where a failed upload lost nothing but reported inside the
  # same job as the analysis.
  code-scanning:
    name: Upload the SARIF to code scanning
    runs-on: ubuntu-latest
    needs: analysis
    permissions:
      contents: read
      # Upload the SARIF to the Code scanning dashboard. This is the only
      # write this workflow holds, and the only reason it holds one.
      security-events: write
    steps:
      # `upload-sarif` resolves the commit and ref it attaches results to from
      # the workflow context, and reads the checkout to do it. Credentials are
      # not persisted here either: nothing in this job needs the token on disk,
      # and the grant above is delivered through the environment, not the file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the SARIF produced by the analysis job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scorecard-sarif
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
