# runner-canary.yml — IANUA
# Early warning for runner-image migrations (currently ubuntu-latest -> Ubuntu
# 26.04, from 2026-10-19; actions/runner-images#14748). Runs the jobs most
# exposed to image changes on the NEXT image, on demand only. Non-blocking by
# design: it is not a required check, every job is continue-on-error, and it
# never deploys, publishes, or writes to the repo. Delete it (or retarget the
# label) once the migration is complete and ci.yml is unpinned.

name: Runner canary (Ubuntu 26.04)

on:
  workflow_dispatch:
  # Also runs on a PR that edits this file, so a canary change is exercised
  # before it merges (workflow_dispatch only works from the default branch).
  pull_request:
    branches: [main]
    paths: [".github/workflows/runner-canary.yml"]

concurrency:
  group: runner-canary-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (AGENTS.md §3).
permissions:
  contents: read

jobs:
  tests:
    name: Tests on ubuntu-26.04 (py${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version most likely to lack a prebuilt for a new image.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest (same gate as ci.yml)
        run: python -m pytest

  sandbox-enforce:
    name: Sandbox enforcement on ubuntu-26.04
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Report the image's container runtime (no workaround applied)
        # Deliberately WITHOUT ci.yml's runc override: the point is to learn
        # whether the new image's podman+crun pair works as shipped.
        run: |
          podman --version
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}'
      - name: Pre-pull the sandbox test image
        run: podman pull docker.io/library/busybox:stable
      - name: Real-container enforcement tests (enforce mode)
        env:
          MCP_SANDBOX_ENFORCE_TESTS: "1"
        run: >-
          python -m pytest tests/security/test_sandbox.py -q
          -o addopts="" -p no:cacheprovider
