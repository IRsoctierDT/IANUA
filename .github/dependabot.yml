# Dependabot — automated dependency-update PRs across every ecosystem in this
# repo. Pairs with the supply-chain controls in AGENTS.md §7-§8: each update PR
# runs the full CI gate (uv.lock sync check, SCA on the pinned closure, hashed
# dev-toolchain install, tests), so a bump that introduces an advisory or breaks
# a test is blocked before merge.
#
# Updates are grouped to reduce PR noise; security updates are never grouped so
# they surface and merge on their own. Runtime (production) bumps always get a
# human review. Low-risk groups — dev-toolchain and actions-all — auto-merge on
# patch/minor once every required check is green (see
# .github/workflows/dependabot-automerge.yml); majors still wait for a human.
# proceed
version: 2

updates:
  # --- Python: managed via uv.lock (the dependency source of truth) ----------
  # Dependabot updates uv.lock; regenerate the exported pip locks + SBOM from it
  # (see security/sbom/README.md) when accepting a Python bump.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Matched by explicit name, NOT by dependency-type: "development".
      # Dependabot classifies everything in pyproject.toml's
      # [project.optional-dependencies] as PRODUCTION — only PEP 735
      # [dependency-groups] / [tool.uv] dev-dependencies read as development,
      # and this project declares its tools in the `dev` extra so they install
      # with `pip install -e ".[dev]"`. So "development" matched nothing and
      # every tool bump fell into `runtime`, which is human-review-only: a ruff
      # bump took the slow path the dev-toolchain group exists to avoid
      # (dependabot-core#10606, #13202).
      #
      # Scope is deliberately TOOLS ONLY — linters, type checkers, test
      # runners, scanners. A bad bump here breaks CI loudly and ships to
      # nobody. Libraries that shipped code imports (pyyaml, reportlab,
      # cryptography, packaging) live in the same `dev` extra but are NOT
      # listed: they change runtime behaviour, so they stay human-reviewed.
      # Keep this list in step with pyproject.toml's [dev] and [fuzz] extras,
      # and keep the group NAME `dev-toolchain` — dependabot-automerge.yml
      # matches on it.
      dev-toolchain:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest"
          - "pytest-cov"
          - "hypothesis"
          - "bandit"
          - "pip-audit"
          - "detect-secrets"
          - "pre-commit"
          - "atheris"
      # Everything else, including the dashboard extra and the imported
      # libraries above. exclude-patterns repeats the list rather than relying
      # on group order: GitHub documents that order matters, but making the two
      # groups disjoint by construction means a reordering cannot silently
      # route a tool bump into the human-review group (or the reverse).
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "mypy"
          - "pytest"
          - "pytest-cov"
          - "hypothesis"
          - "bandit"
          - "pip-audit"
          - "detect-secrets"
          - "pre-commit"
          - "atheris"

  # --- JavaScript: package-lock.json (dashboard/build tooling) ---------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-all:
        patterns: ["*"]

  # --- GitHub Actions: keep CI action versions current & patched -------------
  # Daily: actions run with repository access, so a patched tag should be
  # picked up within a day, not up to a week later.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns: ["*"]
