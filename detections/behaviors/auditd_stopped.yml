title: Audit Daemon Stopped or Disabled
name: auditd_stopped
id: 7f4a2b1c-9d3e-4f5a-8b6c-1e2d3c4b5a60
status: experimental
validation: telemetry-available
signals:
  - auditd-lifecycle
description: >-
  The Linux audit daemon was stopped or disabled. Turning off the sensor that
  records what happens next is defense impairment in its plainest form —
  legitimate only inside a maintenance window. Distinct from history clearing
  (T1070.003): this disables future evidence rather than destroying past
  evidence.
references:
  - https://attack.mitre.org/techniques/T1685/
author: IANUA
date: 2026-08-21
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: linux
  service: auditd
detection:
  selection:
    activity:
      - daemon_end
      - daemon_abort
  condition: selection
fields:
  - host
  - user
falsepositives:
  - Planned maintenance windows and host reboots — corroborate against change records
level: high
