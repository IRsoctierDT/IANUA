title: Endpoint Security Tooling Disabled from the Command Line
name: security_tool_tamper_command
id: 5e7a9c1b-3d2f-4b6e-8c5a-4b5c6d7e8f93
status: experimental
validation: telemetry-required
description: >-
  A command line disabling real-time protection or stopping an endpoint
  security service. An administrator does this rarely and with a ticket; an
  intruder does it first. Requires endpoint command-line telemetry.
references:
  - https://attack.mitre.org/techniques/T1685/
author: IANUA
date: 2026-08-21
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: windows
  category: process_creation
detection:
  selection_tamper:
    command_line|contains:
      - "disablerealtimemonitoring"
      - "disableioavprotection"
      - "sc stop windefend"
      - "systemctl stop auditd"
      - "systemctl disable auditd"
  condition: selection_tamper
fields:
  - command_line
  - user
falsepositives:
  - Endpoint-agent upgrades performed by the management platform itself
level: critical
